<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>CRUD Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">CRUD Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <main class="crud-layout">
    <section class="form-section">
      <h2>{{ editingId ? 'Edit Produk' : 'Tambah Produk' }}</h2>

      <ion-list lines="full">
        <ion-item>
          <ion-input label="Nama Produk" labelPlacement="stacked" placeholder="Contoh: Es Kopi" [(ngModel)]="form.name"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Kategori" labelPlacement="stacked" placeholder="Contoh: Minuman" [(ngModel)]="form.category"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Stok" labelPlacement="stacked" type="number" [(ngModel)]="form.stock"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Harga" labelPlacement="stacked" type="number" [(ngModel)]="form.price"></ion-input>
        </ion-item>
      </ion-list>

      <div class="form-actions">
        <ion-button expand="block" (click)="saveProduct()">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          {{ editingId ? 'Simpan Perubahan' : 'Tambah Produk' }}
        </ion-button>
        <ion-button *ngIf="editingId" expand="block" fill="outline" color="medium" (click)="resetForm()">
          <ion-icon name="close-outline" slot="start"></ion-icon>
          Batal
        </ion-button>
      </div>
    </section>

    <section class="list-section">
      <div class="section-heading">
        <h2>Daftar Produk</h2>
        <ion-badge color="primary">{{ products.length }} item</ion-badge>
      </div>

      <ion-list>
        <ion-item-sliding *ngFor="let product of products">
          <ion-item>
            <ion-label>
              <h3>{{ product.name }}</h3>
              <p>{{ product.category }} · Stok {{ product.stock }} · Rp {{ product.price | number }}</p>
            </ion-label>
            <ion-buttons slot="end">
              <ion-button fill="clear" color="primary" (click)="editProduct(product)" aria-label="Edit produk">
                <ion-icon name="create-outline"></ion-icon>
              </ion-button>
              <ion-button fill="clear" color="danger" (click)="deleteProduct(product.id)" aria-label="Hapus produk">
                <ion-icon name="trash-outline"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-item>
        </ion-item-sliding>
      </ion-list>
    </section>
  </main>
</ion-content>
